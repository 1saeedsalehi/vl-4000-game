name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate sprite atlas sources
        run: python3 tools/atlas/build_atlas.py --check

      - name: Restore
        run: dotnet restore src/Videoland4000.sln

      - name: Build
        run: dotnet build src/Videoland4000.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test src/Core.Tests/Core.Tests.csproj --no-build --configuration Release

      - name: Publish static site
        run: |
          dotnet publish src/BlazorUI/BlazorUI.csproj --configuration Release --output publish
          # Static hosts without content negotiation never serve the precompressed copies; drop them to
          # keep the upload small (Cloudflare compresses on the fly).
          find publish/wwwroot -type f \( -name '*.br' -o -name '*.gz' \) -delete
          du -sh publish/wwwroot

      - name: Upload published site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: publish/wwwroot

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Download published site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Skip when Cloudflare secrets are not configured
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set; skipping the Cloudflare Pages deployment (see README → Deploy)."

      - name: Ensure the Pages project exists
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          if npx --yes wrangler@4 pages project list 2>/dev/null | grep -q "vl-4000-game"; then
            echo "Pages project vl-4000-game already exists."
          else
            npx --yes wrangler@4 pages project create vl-4000-game --production-branch main
          fi

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=vl-4000-game --branch=main --commit-dirty=true
